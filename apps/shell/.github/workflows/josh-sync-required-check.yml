name: Josh Sync Required Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  required-check:
    runs-on: ubuntu-latest
    env:
      SYNC_AUTHOR: blueos-lab-josh-sync[bot]
    steps:
      - name: Require an approval for human pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/require_pull_request_approval.py
