name: Lab CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate trial configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: test -s josh-sync.toml && test -s blueos-version
