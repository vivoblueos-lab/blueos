name: Push kernel changes to BlueOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blueos-push-${{ github.repository }}
  cancel-in-progress: false
jobs:
  push:
    if: ${{ vars.JOSH_SYNC_ENABLED == 'true' }}
    uses: vivoblueos-lab/josh-sync/.github/workflows/blueos-push.yml@e9f1d5239de548178f715e73798de03eeea9d5bc
    with:
      github-app-client-id: ${{ vars.APP_CLIENT_ID }}
      josh-sync-repository: vivoblueos-lab/josh-sync
      josh-sync-revision: e9f1d5239de548178f715e73798de03eeea9d5bc
    secrets:
      github-app-secret: ${{ secrets.APP_PRIVATE_KEY }}
